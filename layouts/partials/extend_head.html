{{- if or .Params.math .Site.Params.math }}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      packages: {'[+]': ['ams', 'boldsymbol']}
    },
    loader: {
      load: ['[tex]/ams', '[tex]/boldsymbol']
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
{{- end }}
<script defer src="{{ "js/site-zoom.js" | relURL }}"></script>
{{- if .IsPage }}
{{- $imageViewer := resources.Get "js/image-viewer.js" | minify | fingerprint }}
<script defer src="{{ $imageViewer.RelPermalink }}" integrity="{{ $imageViewer.Data.Integrity }}"></script>
{{- end }}
<script defer src="{{ "js/tech-terminal.js" | relURL }}"></script>
